name: peonping
version: 0.1.0
kind: standalone
description: "Optional PeonPing event adapter for Hermes lifecycle hooks. Emits session, approval, tool, and subagent events to PeonPing when enabled."
author: "Hermes contributors"
hooks:
  - pre_tool_call
  - pre_llm_call
  - post_llm_call
  - pre_approval_request
  - post_tool_call
  - subagent_stop
  - on_session_finalize
  - on_session_reset
commands:
  - peonping
